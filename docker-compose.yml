services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: miniatures-erp-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - miniatures-network
    command: npm run dev

networks:
  miniatures-network:
    driver: bridge

